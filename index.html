<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>工资计算</title>
  <meta name="theme-color" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="工资计算">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --input: #12151b;
      --text: #e6e8ec;
      --muted: #9aa0aa;
      --accent: #3b82f6;
      --border: #2a2f3a;
      --money: #34d399;
      --money-bg: #0c1f1a;
      --money-border: #1f6b4f;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      padding: 28px 24px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--input);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }
    input[type="time"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-date-and-time-value { filter: invert(0.8); }
    .row { display: flex; gap: 14px; }
    .row .field { flex: 1; }
    .result {
      margin-top: 6px;
      background: var(--money-bg);
      border: 1px solid var(--money-border);
      border-radius: 14px;
      padding: 16px;
    }
    .result .line { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; }
    .result .label { color: var(--muted); font-size: 14px; }
    .result .value { font-size: 20px; font-weight: 700; color: var(--money); }
    .result .value.big { font-size: 26px; }
    .error { margin-top: 12px; color: #f87171; font-size: 14px; min-height: 20px; }
    select {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--input);
      color: var(--text);
      color-scheme: dark;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18); }
    .checkbox-field label { display: flex; align-items: flex-start; gap: 10px; font-weight: 400; font-size: 14px; color: var(--text); cursor: pointer; line-height: 1.4; }
    .checkbox-field input[type="checkbox"] { width: 18px; height: 18px; flex: none; margin-top: 1px; accent-color: var(--accent); }
    .note { color: var(--muted); font-size: 12px; margin: 12px 0 0; line-height: 1.5; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 12px 0 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>工资计算</h1>
    <p class="subtitle">计算实际工时与税前工资</p>

    <div class="row">
      <div class="field">
        <label for="start">上班时间</label>
        <input type="time" id="start" value="11:00">
      </div>
      <div class="field">
        <label for="end">下班时间</label>
        <input type="time" id="end" value="20:30">
      </div>
    </div>

    <div class="field">
      <label for="breakMin">无薪休息时间 <span class="hint">（分钟）</span></label>
      <input type="number" id="breakMin" min="0" step="1" value="30" inputmode="numeric">
    </div>

    <div class="field">
      <label for="rate">时薪 <span class="hint">（澳元 / 小时）</span></label>
      <input type="number" id="rate" min="0" step="0.5" value="26.5" inputmode="decimal">
    </div>

    <div class="field">
      <label for="weeklyHours">每周工作时长 <span class="hint">（小时，用于估算年收入）</span></label>
      <input type="number" id="weeklyHours" min="0" step="1" value="20" inputmode="numeric">
    </div>

    <div class="field">
      <label for="residency">税务身份</label>
      <select id="residency">
        <option value="resident" selected>澳洲税务居民</option>
        <option value="foreign">非居民（外国人）</option>
      </select>
    </div>

    <div class="field checkbox-field" id="medicareRow">
      <label>
        <input type="checkbox" id="medicareExempt" checked>
        <span>不缴 Medicare（2%），我符合豁免条件（国际学生通常可申请）</span>
      </label>
    </div>

    <div class="result">
      <div class="line">
        <span class="label">实际工时</span>
        <span class="value" id="hoursOut">—</span>
      </div>
      <div class="line">
        <span class="label">税前工资</span>
        <span class="value" id="wageOut">—</span>
      </div>
      <hr class="divider">
      <div class="line">
        <span class="label">估算税额</span>
        <span class="value" id="taxOut">—</span>
      </div>
      <div class="line">
        <span class="label">税后工资</span>
        <span class="value big" id="netOut">—</span>
      </div>
      <p class="note" id="taxNote"></p>
    </div>

    <p class="error" id="error"></p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    function toMinutes(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }

    // 2025–26 澳洲税务居民所得税（含低收入抵免 LITO）
    function residentTax(income) {
      let tax = 0;
      if (income > 18200) {
        if (income <= 45000) tax = (income - 18200) * 0.16;
        else if (income <= 135000) tax = 4288 + (income - 45000) * 0.30;
        else if (income <= 190000) tax = 31288 + (income - 135000) * 0.37;
        else tax = 51638 + (income - 190000) * 0.45;
      }
      let lito = 0;
      if (income <= 37500) lito = 700;
      else if (income <= 45000) lito = 700 - (income - 37500) * 0.05;
      else if (income <= 66667) lito = 325 - (income - 45000) * 0.015;
      return Math.max(0, tax - lito);
    }

    // 2025–26 非居民所得税（无免税额）
    function foreignTax(income) {
      if (income <= 135000) return income * 0.30;
      if (income <= 190000) return 40500 + (income - 135000) * 0.37;
      return 60850 + (income - 190000) * 0.45;
    }

    function calc() {
      const start = $('start').value, end = $('end').value;
      const breakMin = parseFloat($('breakMin').value);
      const rate = parseFloat($('rate').value);
      const weeklyHours = parseFloat($('weeklyHours').value);
      const resident = $('residency').value === 'resident';
      const medicareExempt = $('medicareExempt').checked;
      const err = $('error'); err.textContent = '';

      $('medicareRow').style.display = resident ? '' : 'none';

      if (!start || !end) {
        $('hoursOut').textContent = '—'; $('wageOut').textContent = '—';
        $('taxOut').textContent = '—'; $('netOut').textContent = '—';
        $('taxNote').textContent = '';
        err.textContent = '请填写上班时间和下班时间。';
        return;
      }
      if (isNaN(breakMin) || breakMin < 0) { err.textContent = '休息分钟数无效。'; return; }
      if (isNaN(rate) || rate < 0) { err.textContent = '时薪无效。'; return; }

      let diff = toMinutes(end) - toMinutes(start);
      if (diff <= 0) diff += 24 * 60;
      const workMin = Math.max(0, diff - breakMin);
      const hours = workMin / 60;
      const gross = hours * rate;

      $('hoursOut').textContent = hours.toFixed(2) + ' 小时';
      $('wageOut').textContent = 'A$' + gross.toFixed(2);

      // 估算税后工资：按年收入套用累进税率，再折算到本班次
      const wh = (isNaN(weeklyHours) || weeklyHours < 0) ? 0 : weeklyHours;
      const annual = rate * wh * 52;
      let annualTax = resident ? residentTax(annual) : foreignTax(annual);
      if (resident && !medicareExempt) annualTax += annual * 0.02;
      const effRate = annual > 0 ? annualTax / annual : 0;
      const shiftTax = gross * effRate;
      const net = gross - shiftTax;

      $('taxOut').textContent = 'A$' + shiftTax.toFixed(2);
      $('netOut').textContent = 'A$' + net.toFixed(2);
      const label = resident ? '澳洲税务居民' : '非居民';
      const medicareNote = (resident && !medicareExempt) ? '，含 2% Medicare' : '';
      $('taxNote').textContent = '按年收入约 A$' + annual.toFixed(0) + '（每周 ' + wh + ' 小时 × 52 周）' + medicareNote + '，以「' + label + '」估算，仅供参考，实际以 ATO 为准。';
    }

    ['start', 'end', 'breakMin', 'rate', 'weeklyHours'].forEach(id => $(id).addEventListener('input', calc));
    $('residency').addEventListener('change', calc);
    $('medicareExempt').addEventListener('change', calc);
    calc();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
