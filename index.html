<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>工资计算</title>
  <meta name="theme-color" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="工资计算">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --input: #12151b;
      --text: #e6e8ec;
      --muted: #9aa0aa;
      --accent: #3b82f6;
      --border: #2a2f3a;
      --money: #34d399;
      --money-bg: #0c1f1a;
      --money-border: #1f6b4f;
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--text);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      padding: 28px 24px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--input);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }
    .days-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .day label { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
    .checkbox-field label { display: flex; align-items: flex-start; gap: 10px; font-weight: 400; font-size: 14px; color: var(--text); cursor: pointer; line-height: 1.4; }
    .checkbox-field input[type="checkbox"] { width: 18px; height: 18px; flex: none; margin-top: 1px; accent-color: var(--accent); }
    .result {
      margin-top: 6px;
      background: var(--money-bg);
      border: 1px solid var(--money-border);
      border-radius: 14px;
      padding: 16px;
    }
    .result .line { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; }
    .result .label { color: var(--muted); font-size: 14px; }
    .result .value { font-size: 20px; font-weight: 700; color: var(--money); }
    .result .value.big { font-size: 26px; }
    .note { color: var(--muted); font-size: 12px; margin: 12px 0 0; line-height: 1.5; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 12px 0 10px; }
    .error { margin-top: 12px; color: #f87171; font-size: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>工资计算</h1>
    <p class="subtitle">每周 / 两周税后工资估算</p>

    <div class="field">
      <label for="rate">时薪 <span class="hint">（澳元 / 小时）</span></label>
      <input type="number" id="rate" min="0" step="0.5" value="26.5" inputmode="decimal">
    </div>

    <div class="field">
      <label for="days">每周工作天数</label>
      <input type="number" id="days" min="1" max="7" step="1" value="3" inputmode="numeric">
    </div>

    <div class="field">
      <label>每天工作时长 <span class="hint">（小时）</span></label>
      <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="field">
      <label for="residency">税务身份</label>
      <select id="residency">
        <option value="resident" selected>澳洲税务居民</option>
        <option value="foreign">非居民（外国人）</option>
      </select>
    </div>

    <div class="field checkbox-field" id="medicareRow">
      <label>
        <input type="checkbox" id="medicareExempt" checked>
        <span>不缴 Medicare（2%），我符合豁免条件（国际学生通常可申请）</span>
      </label>
    </div>

    <div class="result">
      <div class="line">
        <span class="label">本周工时</span>
        <span class="value" id="hoursOut">—</span>
      </div>
      <div class="line">
        <span class="label">每周税前</span>
        <span class="value" id="grossOut">—</span>
      </div>
      <hr class="divider">
      <div class="line">
        <span class="label">每周税后</span>
        <span class="value big" id="weeklyNet">—</span>
      </div>
      <div class="line">
        <span class="label">两周税后</span>
        <span class="value big" id="fortnightNet">—</span>
      </div>
      <p class="note" id="note"></p>
    </div>

    <p class="error" id="error"></p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

    // 2025–26 澳洲税务居民所得税（含低收入抵免 LITO）
    function residentTax(income) {
      let tax = 0;
      if (income > 18200) {
        if (income <= 45000) tax = (income - 18200) * 0.16;
        else if (income <= 135000) tax = 4288 + (income - 45000) * 0.30;
        else if (income <= 190000) tax = 31288 + (income - 135000) * 0.37;
        else tax = 51638 + (income - 190000) * 0.45;
      }
      let lito = 0;
      if (income <= 37500) lito = 700;
      else if (income <= 45000) lito = 700 - (income - 37500) * 0.05;
      else if (income <= 66667) lito = 325 - (income - 45000) * 0.015;
      return Math.max(0, tax - lito);
    }

    // 2025–26 非居民所得税（无免税额）
    function foreignTax(income) {
      if (income <= 135000) return income * 0.30;
      if (income <= 190000) return 40500 + (income - 135000) * 0.37;
      return 60850 + (income - 190000) * 0.45;
    }

    // 构建 7 天的工时输入框（一次构建，靠显隐切换，保留已填值）
    const grid = $('daysGrid');
    DAYS.forEach((name) => {
      const d = document.createElement('div');
      d.className = 'day';
      const label = document.createElement('label');
      label.textContent = name;
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.step = '0.5';
      input.placeholder = '0';
      input.inputMode = 'decimal';
      d.appendChild(label);
      d.appendChild(input);
      grid.appendChild(d);
    });

    function daysCount() {
      const n = parseInt($('days').value, 10);
      if (isNaN(n)) return 1;
      return Math.min(7, Math.max(1, n));
    }

    function applyDays(n) {
      grid.querySelectorAll('.day').forEach((d, i) => {
        d.style.display = i < n ? '' : 'none';
      });
      calc();
    }

    function calc() {
      const rate = parseFloat($('rate').value);
      const resident = $('residency').value === 'resident';
      const medicareExempt = $('medicareExempt').checked;
      const err = $('error');
      err.textContent = '';
      $('medicareRow').style.display = resident ? '' : 'none';

      if (isNaN(rate) || rate < 0) {
        err.textContent = '时薪无效。';
        $('hoursOut').textContent = '—';
        $('grossOut').textContent = '—';
        $('weeklyNet').textContent = '—';
        $('fortnightNet').textContent = '—';
        $('note').textContent = '';
        return;
      }

      let totalHours = 0, workDays = 0;
      grid.querySelectorAll('.day').forEach((d) => {
        if (d.style.display === 'none') return;
        const h = parseFloat(d.querySelector('input').value) || 0;
        totalHours += h;
        if (h > 0) workDays++;
      });

      if (totalHours <= 0) {
        $('hoursOut').textContent = '—';
        $('grossOut').textContent = 'A$0.00';
        $('weeklyNet').textContent = 'A$0.00';
        $('fortnightNet').textContent = 'A$0.00';
        $('note').textContent = '请在上方填写每天的工作时长（小时）。';
        return;
      }

      const weeklyGross = totalHours * rate;
      const fortnightGross = weeklyGross * 2;
      const annual = weeklyGross * 52;

      let annualTax = resident ? residentTax(annual) : foreignTax(annual);
      if (resident && !medicareExempt) annualTax += annual * 0.02;
      const eff = annual > 0 ? annualTax / annual : 0;
      const weeklyNet = weeklyGross * (1 - eff);
      const fortnightNet = fortnightGross * (1 - eff);

      $('hoursOut').textContent = workDays + ' 天 · ' + totalHours.toFixed(1) + ' 小时';
      $('grossOut').textContent = 'A$' + weeklyGross.toFixed(2);
      $('weeklyNet').textContent = 'A$' + weeklyNet.toFixed(2);
      $('fortnightNet').textContent = 'A$' + fortnightNet.toFixed(2);

      const label = resident ? '澳洲税务居民' : '非居民';
      const medicareNote = (resident && !medicareExempt) ? '，含 2% Medicare' : '';
      $('note').textContent = '按年收入约 A$' + annual.toFixed(0) + '（每周 ' + totalHours.toFixed(1) + ' 小时 × 52 周）' + medicareNote + '，以「' + label + '」估算，仅供参考，实际以 ATO 为准。';
    }

    $('rate').addEventListener('input', calc);
    $('days').addEventListener('input', () => applyDays(daysCount()));
    $('days').addEventListener('change', () => {
      const n = daysCount();
      $('days').value = n;
      applyDays(n);
    });
    $('days').addEventListener('focus', (e) => e.target.select());
    $('residency').addEventListener('change', calc);
    $('medicareExempt').addEventListener('change', calc);
    grid.addEventListener('input', calc);

    applyDays(daysCount());

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
